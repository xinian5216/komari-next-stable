name: Security Scan

on:
  push:
    branches: [stable]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-scan.yml"
  pull_request:
    branches: [stable]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-dependencies:
    name: npm audit (production, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exactly from lockfile
        run: npm ci --ignore-scripts --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  security-gate:
    name: security-gate
    if: ${{ always() }}
    needs: [production-dependencies, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require dependency and CodeQL scans
        run: |
          test "${{ needs.production-dependencies.result }}" = success
          test "${{ needs.codeql.result }}" = success
