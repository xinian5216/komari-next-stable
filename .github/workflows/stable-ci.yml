name: Komari Next Stable CI

# 每个 push / PR 都执行：依赖安装（npm ci）、lint、构建、主题包校验。
# 主题包校验与 Komari Server 端（web/api/admin/theme.go）的规则保持一致，
# 任何不符合规范的产物都不应进入 Release。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Enforce immutable third-party Actions
        run: python3 .github/scripts/check-workflow-pins.py

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Lint (report only)
        # 上游 src/ 在 1.4.19 基线自带 23 个 lint error / 29 个 warning；本 fork 只做镜像，
        # 不修改主题源码，因此 lint 以报告模式运行（写入 lint-report.txt 并随 artifact 上传），
        # 不作为硬门禁。供应链关键步骤（npm ci / build / 主题包校验 / secret scan）仍是硬门禁。
        run: |
          set -uo pipefail
          npm run lint > lint-report.txt 2>&1 || echo "lint reported problems (see lint-report.txt)"
          tail -20 lint-report.txt

      - name: Verify plugin login compatibility hooks
        run: npm run test:plugin-hooks

      - name: Verify stable theme version
        run: npm run test:theme-version

      - name: Build
        run: npm run build

      - name: Verify the manifest declares short=next
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          manifest = json.load(open("komari-theme.json", encoding="utf-8"))
          assert manifest.get("short") == "next", f"unexpected short: {manifest.get('short')!r}"
          print("manifest:", manifest["name"], manifest["version"], "short=" + manifest["short"])
          PY

      - name: Package the theme package
        run: bash scripts/package-theme.sh dist-release.zip

      - name: Checksums
        run: sha256sum dist-release.zip | tee SHA256SUMS

      - name: Upload the validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-release
          path: |
            dist-release.zip
            SHA256SUMS
            lint-report.txt
          if-no-files-found: error

  required-gate:
    name: required-gate
    if: ${{ always() }}
    needs: [build-and-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require the validated theme package
        run: test "${{ needs.build-and-validate.result }}" = success
