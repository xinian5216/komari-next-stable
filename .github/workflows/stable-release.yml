name: Komari Next Stable Release

# 由 release 发布事件触发；workflow_dispatch 只允许补齐包含不可变守卫的新 tag 的缺失资产。
# GitHub 在 release 事件里使用 tag 自带的 workflow 定义；不能借此修改旧 tag 的历史行为。
#
# 产物：dist-release.zip（Komari 主题包规范布局）+ SHA256SUMS + dist-release.zip.sha256

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "包含不可变发布守卫的现有 stable tag（仅补缺，不覆盖）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: next-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Require immutable publication guard from released tag
        run: |
          test -f scripts/publish-release-assets.py || {
            echo "::error::legacy tag lacks the immutable publisher; automatic re-publication is refused"
            exit 1
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify release tag matches theme version
        run: npm run test:theme-version

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Lint (report only)
        # 同 CI：上游基线自带 lint 问题，本 fork 不修改主题源码，故 lint 不阻断发布。
        run: |
          set -uo pipefail
          npm run lint > lint-report.txt 2>&1 || echo "lint reported problems (see log)"
          tail -20 lint-report.txt

      - name: Verify plugin login compatibility hooks
        run: npm run test:plugin-hooks

      - name: Build
        run: npm run build

      - name: Package, validate and checksum
        run: |
          set -euxo pipefail
          bash scripts/package-theme.sh dist-release.zip
          sha256sum dist-release.zip > SHA256SUMS
          sha256sum dist-release.zip | awk '{print $1}' > dist-release.zip.sha256
          cat SHA256SUMS

      - name: Publish and verify immutable release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/publish-release-assets.py "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" .
